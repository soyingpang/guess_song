<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4e6" />
    <meta name="application-name" content="估歌仔" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="估歌仔" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>估歌仔 · 玩家</title>
    <link rel="manifest" href="./manifest.webmanifest?v=onsite-v4" />
    <link rel="icon" type="image/svg+xml" href="./assets/app-icon.svg" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=onsite-v4" />
    <link rel="stylesheet" href="./player.css?v=onsite-v4" />
  </head>
  <body class="player-body">
    <main class="player-shell">
      <section class="player-card">
        <div class="phone-fx-layer" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <header class="phone-app-bar">
          <div class="phone-app-brand">
            <img class="brand-mark" src="./assets/worship-crest.svg" alt="" aria-hidden="true" />
            <div>
              <p class="eyebrow">手機玩家</p>
              <h1>估歌仔</h1>
            </div>
          </div>
          <div class="phone-app-actions">
            <span class="phone-live-pill" id="phoneLivePill">待命</span>
            <button class="ghost-button icon-action-button phone-settings-button" id="phoneSettingsButton" type="button" title="設定" aria-label="設定">
              設定
            </button>
          </div>
        </header>
        <div class="phone-hero-card" aria-hidden="true">
          <div class="phone-hero-note">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <strong>現場即時答題</strong>
        </div>

        <form class="join-form" id="joinForm">
          <div class="phone-join-kicker">
            <strong>手機房間</strong>
            <span id="phoneJoinRoomPill">連線就緒</span>
          </div>
          <div class="phone-join-preview" aria-hidden="true">
            <b class="phone-join-avatar" id="phoneJoinAvatar">你</b>
            <span class="phone-join-copy">
              <strong id="phoneJoinPreviewName">準備加入</strong>
              <small>今晚用手機答題和看分數</small>
            </span>
          </div>
          <div class="phone-join-flow" aria-hidden="true">
            <span><b>聽歌</b>現場</span>
            <span><b>答題</b>即時</span>
            <span><b>排名</b>更新</span>
          </div>
          <label for="playerName">你的名字</label>
          <div class="guess-line">
            <input id="playerName" required autocomplete="name" maxlength="18" placeholder="輸入名字" />
            <button class="primary-button" id="joinSubmitButton" type="submit">加入遊戲</button>
          </div>
          <p class="join-note">音樂由現場電腦播放；手機只會顯示答案選項、結果和分數。</p>
        </form>

        <div class="player-status" id="playerStatus">掃 QR 後輸入名字加入</div>
        <div class="player-scoreline">
          <span id="playerScore">
            <em id="playerScoreValue">0 分</em>
            <b class="phone-score-burst" id="phoneScoreBurst" hidden>+0</b>
          </span>
          <span id="playerRound">未開始</span>
          <button class="ghost-button leaderboard-button" id="openLeaderboardButton" type="button">
            排行榜
          </button>
        </div>

        <section class="phone-question" id="phoneQuestion">
          <p id="phoneStatus">等候主持開始</p>
          <h2 id="phoneTitle">準備中</h2>
          <div class="phone-stage-cue" id="phoneStageCue" hidden aria-live="polite">
            <span class="phone-stage-cue-icon" id="phoneStageCueIcon">♪</span>
            <strong id="phoneStageCueTitle">第 1 題</strong>
            <small id="phoneStageCueDetail">準備開始</small>
          </div>
          <div class="phone-answer-card" id="phoneAnswerCard" hidden>
            <span>正確答案</span>
            <strong id="phoneAnswerTitle"></strong>
            <small id="phoneAnswerMeta"></small>
          </div>
          <div class="phone-hints" id="phoneHints"></div>
          <div class="phone-choices" id="phoneChoices"></div>
          <button class="buzz-button" id="buzzButton" type="button" hidden>搶答</button>
          <div class="phone-cooldown" id="phoneCooldown" hidden>
            <span>
              <strong id="phoneCooldownTitle">答錯冷卻中</strong>
              <small id="phoneCooldownText">5 秒後可以再答</small>
            </span>
            <i id="phoneCooldownBar"></i>
          </div>
          <div class="phone-result" id="phoneResult"></div>
        </section>

        <div class="phone-moment" id="phoneMoment" hidden aria-live="polite">
          <div class="phone-moment-sparks" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span class="phone-moment-icon" id="phoneMomentIcon">✓</span>
          <strong id="phoneMomentTitle">答中</strong>
          <small id="phoneMomentDetail">加分成功</small>
        </div>

      </section>

      <div class="phone-modal" id="leaderboardModal" role="dialog" aria-modal="true" aria-labelledby="leaderboardTitle" hidden>
        <div class="phone-modal-panel">
          <div class="phone-modal-head">
            <h2 id="leaderboardTitle">排行榜</h2>
            <button class="ghost-button" id="closeLeaderboardButton" type="button">關閉</button>
          </div>
          <div id="phoneLeaderboard">
            <div class="phone-empty">等候排行榜</div>
          </div>
        </div>
      </div>

      <div class="phone-modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
        <div class="phone-modal-panel phone-settings-panel">
          <div class="phone-modal-head">
            <h2 id="settingsTitle">設定</h2>
            <button class="ghost-button" id="closeSettingsButton" type="button">關閉</button>
          </div>
          <div class="phone-settings-list">
            <label class="phone-setting-row">
              <span>
                <strong>動態特效</strong>
                <small>更有氣氛的介面動作</small>
              </span>
              <input id="motionEffectsToggle" type="checkbox" />
            </label>
            <label class="phone-setting-row">
              <span>
                <strong>觸感回饋</strong>
                <small>答題和搶答時輕震一下</small>
              </span>
              <input id="hapticsToggle" type="checkbox" />
            </label>
            <label class="phone-setting-row">
              <span>
                <strong>精簡畫面</strong>
                <small>適合舊手機和弱網絡</small>
              </span>
              <input id="compactModeToggle" type="checkbox" />
            </label>
          </div>
        </div>
      </div>
    </main>

    <script src="./firebase-config.js?v=onsite-v4"></script>
    <script src="./firebase-sync.js?v=onsite-v4"></script>
    <script src="./vendor/peerjs.min.js?v=1.5.5"></script>
    <script src="./player.js?v=onsite-v4"></script>
    <script src="./pwa.js?v=onsite-v4"></script>
  </body>
</html>
